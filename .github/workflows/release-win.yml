name: "Release (Windows: CUDA 13.3 + CUDA 12.4 + Vulkan + CPU)"

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

concurrency:
  group: release-win
  queue: max

jobs:

  windows-cpu:

    runs-on: windows-2025-vs2026

    permissions:
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'x64'
            vcvars_arch: 'x64'
          - arch: 'arm64'
            vcvars_arch: 'amd64_arm64'

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install Ninja
        run: |
          choco install ninja

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-win4-windows-2025-vs2026-${{ matrix.arch }}-cpu-msvc

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { Write-Host "::error::No Visual Studio installation found"; exit 1 }
          Write-Host "VS root: $root"
          Add-Content $env:GITHUB_ENV "VS_ROOT=$root"

      - name: Build
        shell: cmd
        run: |
          call "%VS_ROOT%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars_arch }}
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=${{ matrix.arch == 'x64' && 'ON' || 'OFF' }} ^
            ${{ env.CMAKE_ARGS }}
          if %ERRORLEVEL% NEQ 0 exit /b 1
          cmake --build build --config Release

      - name: ccache-clear
        uses: ./.github/actions/ccache-clear
        with:
          key: release-win4-windows-2025-vs2026-${{ matrix.arch }}-cpu-msvc

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          $omp = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\debug_nonredist\${{ matrix.arch }}\Microsoft.VC*\OpenMP.LLVM\libomp140.${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($omp) { Copy-Item $omp.FullName .\build\bin\Release\; Write-Host "Copied libomp from $($omp.FullName)" } else { Write-Host "No LLVM OpenMP runtime found in VS Redist; skipping." }
          7z a -snl llama-bin-win-cpu-${{ matrix.arch }}.zip .\build\bin\Release\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-bin-win-cpu-${{ matrix.arch }}.zip
          name: llama-bin-win-cpu-${{ matrix.arch }}.zip

  windows:

    runs-on: windows-2025-vs2026

    permissions:
      actions: write

    env:
      VULKAN_VERSION: 1.4.357.0

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: 'vulkan'
            arch: 'x64'
            vcvars_arch: 'x64'
            defines: '-DGGML_VULKAN=ON'
            target: 'ggml-vulkan'
          - backend: 'opencl-adreno'
            arch: 'arm64'
            vcvars_arch: 'amd64_arm64'
            defines: '-DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON'
            target: 'ggml-opencl'

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install Vulkan SDK
        id: get_vulkan
        if: ${{ matrix.backend == 'vulkan' }}
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Install OpenCL Headers and Libs
        id: install_opencl
        if: ${{ matrix.backend == 'opencl-adreno' && matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          git clone https://github.com/KhronosGroup/OpenCL-Headers
          cd OpenCL-Headers
          cmake -B build `
            -DBUILD_TESTING=OFF `
            -DOPENCL_HEADERS_BUILD_TESTING=OFF `
            -DOPENCL_HEADERS_BUILD_CXX_TESTS=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/opencl-arm64-release"
          cmake --build build --target install
          git clone https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cd OpenCL-ICD-Loader
          cmake -B build-arm64-release `
            -A arm64 `
            -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/opencl-arm64-release" `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/opencl-arm64-release"
          cmake --build build-arm64-release --target install --config release

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { Write-Host "::error::No Visual Studio installation found"; exit 1 }
          Write-Host "VS root: $root"
          Add-Content $env:GITHUB_ENV "VS_ROOT=$root"

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          call "%VS_ROOT%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars_arch }}
          if ${{ matrix.backend == 'opencl-adreno' }} == true (
            cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_PREFIX_PATH="%RUNNER_TEMP%\opencl-arm64-release" ${{ matrix.defines }} -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_BACKEND_DL=ON -DLLAMA_BUILD_BORINGSSL=ON
          ) else (
            cmake -S . -B build -G "Ninja Multi-Config" ${{ matrix.defines }} -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_BACKEND_DL=ON -DLLAMA_BUILD_BORINGSSL=ON
          )
          if %ERRORLEVEL% NEQ 0 exit /b 1
          cmake --build build --config Release --target ${{ matrix.target }}

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          7z a -snl llama-bin-win-${{ matrix.backend }}-${{ matrix.arch }}.zip .\build\bin\Release\${{ matrix.target }}.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-bin-win-${{ matrix.backend }}-${{ matrix.arch }}.zip
          name: llama-bin-win-${{ matrix.backend }}-${{ matrix.arch }}.zip

  windows-cuda:
    name: windows-cuda (${{ matrix.cuda }}, ${{ matrix.arch }})

    runs-on: windows-2022

    permissions:
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.4'
            arch: x64
            cuda_arch: 'x64'
            defines: '-DGGML_NATIVE=OFF -DLLAMA_CUBLAS=ON -DCMAKE_CUDA_ARCHITECTURES=75'
            cuda_host: ''
            cuda_host_arch: 'x64'
            cudart: 'ON'
          - cuda: '13.3'
            arch: x64
            cuda_arch: 'x64'
            defines: '-DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75'
            cuda_host: ''
            cuda_host_arch: 'x64'
            cudart: 'ON'
          - cuda: '13.4'
            arch: arm64
            cuda_arch: 'arm64'
            defines: '-DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=110'
            cuda_host: '-DCMAKE_CUDA_HOST_COMPILER="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.44.35207/bin/Hostx64/arm64/cl.exe"'
            cuda_host_arch: 'amd64_arm64'
            cudart: 'ON'

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install CUDA ${{ matrix.cuda }}
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}
          cuda_arch: ${{ matrix.cuda_arch }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-win4-windows-2022-cuda-${{ matrix.cuda }}-${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.cuda_host_arch }}
          cmake -S . -B build -G "Ninja Multi-Config" ^
            ${{ matrix.defines }} ^
            ${{ matrix.cuda_host }} ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_BACKEND_DL=ON ^
            ${{ env.CMAKE_ARGS }}
          if %ERRORLEVEL% NEQ 0 exit /b 1
          cmake --build build --config Release

      - name: ccache-clear
        uses: ./.github/actions/ccache-clear
        with:
          key: release-win4-windows-2022-cuda-${{ matrix.cuda }}-${{ matrix.arch }}

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          7z a -snl llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip .\build\bin\Release\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip
          name: llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip

      - name: Pack cudart artifacts
        id: pack_cudart_artifacts
        if: ${{ matrix.cudart == 'ON' }}
        run: |
          7z a -snl cudart-llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip .\build\bin\Release\ggml-cuda\*

      - name: Upload cudart artifacts
        uses: actions/upload-artifact@v6
        if: ${{ matrix.cudart == 'ON' }}
        with:
          path: cudart-llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip
          name: cudart-llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip

  release:
    needs: [windows, windows-cpu, windows-cuda]

    permissions:
      contents: write

    runs-on: ubuntu-slim

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get tag name
        id: get_tag_name
        uses: ./.github/actions/get-tag-name

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Move artifacts
        run: |
          mkdir -p release
          tag="${{ steps.get_tag_name.outputs.tag }}"
          mv release-assets/llama-bin-win-cpu-x64.zip        release/llama-${tag}-bin-win-cpu-x64.zip
          mv release-assets/llama-bin-win-cpu-arm64.zip       release/llama-${tag}-bin-win-cpu-arm64.zip
          mv release-assets/llama-bin-win-vulkan-x64.zip      release/llama-${tag}-bin-win-vulkan-x64.zip
          mv release-assets/llama-bin-win-opencl-adreno-arm64.zip release/llama-${tag}-bin-win-opencl-adreno-arm64.zip
          mv release-assets/llama-bin-win-cuda-12.4-x64.zip   release/llama-${tag}-bin-win-cuda-12.4-x64.zip
          mv release-assets/llama-bin-win-cuda-13.3-x64.zip   release/llama-${tag}-bin-win-cuda-13.3-x64.zip
          mv release-assets/cudart-llama-bin-win-cuda-12.4-x64.zip release/
          mv release-assets/cudart-llama-bin-win-cuda-13.3-x64.zip release/
          # merge CPU DLLs into the CUDA / Vulkan zips (upstream does the same)
          mkdir -p tmp-cpu && cd tmp-cpu
          unzip -q ../release/llama-${tag}-bin-win-cpu-x64.zip
          for z in cuda-12.4-x64 cuda-13.3-x64 vulkan-x64; do
            cp -n llama*.dll llama-*[0-9].* ../release/llama-${tag}-bin-win-${z}.zip 2>/dev/null || true
          done
          cd .. && rm -rf tmp-cpu
          ls -la release

      - name: Create release
        uses: ggml-org/action-create-release@v1
        with:
          tag_name: ${{ steps.get_tag_name.outputs.tag }}
          repo: ${{ github.repository }}
          upload: ${{ inputs.create_release }}
          files: |
            ./release/llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cpu-x64.zip
            ./release/llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cpu-arm64.zip
            ./release/llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-vulkan-x64.zip
            ./release/llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-opencl-adreno-arm64.zip
            ./release/llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cuda-12.4-x64.zip
            ./release/llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cuda-13.3-x64.zip
            ./release/cudart-llama-bin-win-cuda-12.4-x64.zip
            ./release/cudart-llama-bin-win-cuda-13.3-x64.zip
          name: ${{ steps.get_tag_name.outputs.tag }}
          body: |
            Windows binaries built from this fork (LongCat-Flash-Lite support: `longcat-flash-ngram` architecture).

            * `llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cpu-x64.zip` - CPU (x64)
            * `llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cpu-arm64.zip` - CPU (arm64)
            * `llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cuda-12.4-x64.zip` - CUDA 12.4 (x64)
            * `llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-cuda-13.3-x64.zip` - CUDA 13.3 (x64)
            * `cudart-llama-bin-win-cuda-12.4-x64.zip` - CUDA 12.4 runtime DLLs
            * `cudart-llama-bin-win-cuda-13.3-x64.zip` - CUDA 13.3 runtime DLLs
            * `llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-vulkan-x64.zip` - Vulkan (x64)
            * `llama-${{ steps.get_tag_name.outputs.tag }}-bin-win-opencl-adreno-arm64.zip` - OpenCL Adreno (arm64)

            MTP speculative decoding (`--spec-type draft-mtp`) is enabled for LongCat-Flash-Lite GGUFs.
